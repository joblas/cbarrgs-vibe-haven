version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Group minor/patch updates into a single PR to reduce noise
      dependencies:
        update-types:
          - minor
          - patch
      # stylelint and stylelint-config-standard are coupled: the config's peer
      # dependency requires a matching stylelint. Group them so a bump of
      # either (including majors) arrives as one PR and merges as one — never
      # one merged without the other.
      stylelint-stack:
        applies-to: version-updates
        patterns:
          - stylelint
          - stylelint-config-standard
    ignore:
      # Major version bumps that would break the project
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: framer-motion
        update-types: ["version-update:semver-major"]
      - dependency-name: lucide-react
        update-types: ["version-update:semver-major"]
      - dependency-name: globals
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript < 6.1; 7.x crashed `npm run lint`.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Keep the SHA-pinned GitHub Actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
