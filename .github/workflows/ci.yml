name: CI

# The check the ship gate waits for. Build is the verdict; lint is shown but
# not blocking until `npm run lint` runs clean on main (it currently crashes on
# a module-load error — a separate fix). The tripwire mechanizes enforcement
# rule 1 for direct pushes: Carlos's bot pushes JS/content changes to main by
# Joe's decision (2026-09-05), so a direct push that touches a gated path must
# go red in minutes, not at the next audit pass.

on:
  push:
    branches: [main]
  pull_request:
  # Merges made with GITHUB_TOKEN (Dependabot's auto-merge) fire no push run, so
  # a daily run on main keeps a current CI verdict for main to cite.
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The tripwire asks the API which PR (if any) produced the pushed commit.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the tripwire below diffs the pushed range.
          fetch-depth: 0

      # Gated-path tripwire — a direct push to main (not a PR merge) that touches a
      # gated path fails this run. A push passes as a PR merge only when the API
      # names a PR merged into main whose merge_commit_sha is the pushed commit
      # and whose head is a DIFFERENT commit (merge, squash and rebase merges
      # all create one); a PR's head branch pushed straight to main is
      # auto-marked merged with merge_commit_sha == that same head commit, and
      # that push is judged, never excused. The committer email is never
      # trusted, since anyone can set it.
      - name: Gated-path tripwire (enforcement rule 1)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merged=$(gh api "repos/$REPO/commits/$AFTER/pulls" --jq \
            "[.[] | select(.merged_at != null and .merge_commit_sha == \"$AFTER\" and .base.ref == \"main\" and .head.sha != \"$AFTER\")] | length")
          case "$merged" in
            ''|*[!0-9]*) echo "::error title=Tripwire query failed::could not ask which PR produced $AFTER (got '$merged')"; exit 1 ;;
          esac
          if [ "$merged" -gt 0 ]; then
            echo "$AFTER is the merge commit of a PR merged into main — allowed"; exit 0
          fi
          # A force-push can orphan BEFORE; fetch it by SHA, and fail closed if it
          # is still missing rather than skip the check.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error title=Tripwire has no base::push has no base commit; cannot verify gated paths"; exit 1
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git fetch --quiet origin "$BEFORE" 2>/dev/null || true
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "::error title=Tripwire has no base::base commit $BEFORE is unreachable (force-push?); cannot verify gated paths"; exit 1
            fi
          fi
          # One list, shared with the ship gate: .github/gated-paths.regex (one
          # extended regex per line). It is read from BEFORE, not from the
          # checkout of AFTER: a direct push must not be able to drop \.github/
          # from its own tripwire list in the same commit as a gated change.
          # Blank lines are dropped because an empty pattern matches every path;
          # an empty LIST is an error because zero patterns would match nothing
          # and pass every push. The gate itself always holds changes to this
          # file's own regex on PRs; this is the direct-push backstop.
          if ! patterns=$(git show "$BEFORE:.github/gated-paths.regex" 2>/dev/null | grep -v '^[[:space:]]*$' | tr -d '\r'); then
            echo "::error title=Gated list missing::.github/gated-paths.regex is missing or unreadable at $BEFORE — the tripwire cannot run"
            exit 1
          fi
          if [ -z "$patterns" ]; then
            echo "::error title=Gated list missing::.github/gated-paths.regex is missing or empty at $BEFORE — the tripwire cannot run"
            exit 1
          fi
          # --no-renames lists a rename's source path too, so moving a file out of
          # a gated path is caught. git -c core.quotePath=false + diff -z: the
          # default name-only output C-quotes any path with non-ASCII bytes, a
          # quote, backslash or control chars (".github/workflows/d\303\251.yml"),
          # which a ^-anchored pattern can never match — a unicode-named gated
          # file would read as clean. -z separates entries with NUL bytes, and
          # grep -z matches whole NUL-separated records (the pattern file stays
          # newline-separated; grep reads -f pattern files line-wise even under
          # -z). NUL bytes cannot live in a shell variable, so both go through
          # temp files. grep exits 1 for no match and 2 for a pattern it cannot
          # parse; only a clean "no match" lets a push through, and a git diff
          # failure is an error, never "clean" — both must fail closed.
          # NB: the || rc=$? must sit OUTSIDE the $(…) — inside it, rc=$? runs
          # in the subshell and the parent's rc stays 0, so a malformed list
          # would read as clean (harness case "audit-F2'", verified on GNU grep
          # 3.11: buggy idiom rc=0, correct idiom rc=2).
          diff_list=$(mktemp); pat_list=$(mktemp)
          printf '%s\n' "$patterns" > "$pat_list"
          if ! git -c core.quotePath=false diff -z --no-renames --name-only "$BEFORE" "$AFTER" > "$diff_list"; then
            echo "::error title=Tripwire diff failed::git diff $BEFORE..$AFTER could not be computed; cannot verify gated paths"
            exit 1
          fi
          rc=0
          hits=$(grep -z -E -f "$pat_list" "$diff_list" | tr '\0' '\n') || rc=$?
          case "$rc" in
            0) ;;
            1) hits="" ;;
            *) echo "::error title=Gated list failed to parse::.github/gated-paths.regex at $BEFORE has a line grep cannot parse (exit $rc) — cannot verify gated paths"; exit 1 ;;
          esac
          if [ -n "$hits" ]; then
            echo "::error title=Gated path pushed directly::Enforcement rule 1 — these paths change only via a needs-joe PR merged on Joe's word:"
            echo "$hits"
            exit 1
          fi
          echo "direct push touches no gated paths — ok"

      # Regression tests for the guard scripts above and in the other workflows.
      - name: Workflow guard tests
        run: bash .github/tests/workflow-guards.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # vite build never compiles functions/ (the app tsconfig includes src only),
      # so the Pages Functions get their own typecheck.
      - name: Typecheck the Pages Functions
        run: npx tsc -p functions --noEmit
      - name: Lint (non-blocking until it runs clean on main)
        continue-on-error: true
        run: npm run lint
